name: "Get PR Branch"
description: "Determines the target branch to use based on PR number, base branch, or default"
inputs:
  target_repository:
    description: "The repository to check for the PR branch"
    required: true
  default_target_ref:
    description: "Ref to use if no target branch is found"
    required: false
    default: "devel"
outputs:
  target-branch:
    description: "The determined target branch"
    value: ${{ steps.get_target_branch.outputs.TARGET_BRANCH }}
runs:
  using: "composite"
  steps:
    - name: "Get target branch"
      id: get_target_branch
      env:
        TARGET_REPOSITORY: ${{ inputs.target_repository }}
        DEFAULT_TARGET_REF: ${{ inputs.default_target_ref }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.number }}
        GH_TOKEN: ${{ github.token }}
      run: |
        BRANCH_NAME="${GITHUB_REF#refs/heads/}"
        echo "Looking for 'pr-${PR_NUMBER}'/'${BRANCH_NAME}'"
        AUTH_HEADER=()
        if [[ -n "${GH_TOKEN}" ]]; then
          AUTH_HEADER=(-H "Authorization: Bearer ${GH_TOKEN}")
        fi
        response_code_pr=`curl "${AUTH_HEADER[@]}" -w '%{response_code}' https://api.github.com/repos/${TARGET_REPOSITORY}/branches/pr-${PR_NUMBER} -o /dev/null`
        response_code_branch=`curl "${AUTH_HEADER[@]}" -w '%{response_code}' https://api.github.com/repos/${TARGET_REPOSITORY}/branches/${BRANCH_NAME} -o /dev/null`
        if [[ "${EVENT_NAME}" == "pull_request" && "$response_code_pr" == "200" ]]; then
          echo "TARGET_BRANCH=pr-${PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "PR branch found, using pr-${PR_NUMBER}"
        elif [[ "$response_code_branch" == "200" ]]; then
          echo "TARGET_BRANCH=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "Base branch found, using ${BRANCH_NAME}"
        else
          echo "TARGET_BRANCH=${DEFAULT_TARGET_REF}" >> $GITHUB_OUTPUT
          echo "PR branch not found, using ${DEFAULT_TARGET_REF}"
        fi
      shell: bash
