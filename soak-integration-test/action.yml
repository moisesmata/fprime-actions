name: "F´ Soak Integration Test"
description: "Run pytest integration tests against the persistent soak GDS"
inputs:
  dictionary:
    description: "Path (glob allowed) to the deployment dictionary JSON passed to pytest"
    required: true
  fsw-service:
    description: "Optional systemd service name to verify is active before running tests (e.g. fprime-soak-fsw)"
    required: false
    default: ""
  test-path:
    description: "Path to the integration test file or directory to run"
    required: true
  working-directory:
    description: "Directory to run pytest from"
    required: false
    default: "."
  venv:
    description: "Path to a virtualenv to activate before running pytest (use the persistent soak venv so it shares fprime-gds). Leave empty to use the ambient environment."
    required: false
    default: ""
  pytest-args:
    description: "Extra arguments passed to pytest (e.g. --deployment-config path)"
    required: false
    default: ""
  timeout:
    description: "Timeout in seconds for the pytest run"
    required: false
    default: "300"
runs:
  using: "composite"
  steps:
    - name: "Soak Integration Test"
      shell: bash
      env:
        DICTIONARY: ${{ inputs.dictionary }}
        FSW_SERVICE: ${{ inputs.fsw-service }}
        TEST_PATH: ${{ inputs.test-path }}
        WORKING_DIR: ${{ inputs.working-directory }}
        VENV: ${{ inputs.venv }}
        PYTEST_ARGS: ${{ inputs.pytest-args }}
        TIMEOUT_SECONDS: ${{ inputs.timeout }}
      run: |
        set -e

        # Verify the flight-software service is up before testing.
        if [ -n "${FSW_SERVICE}" ]; then
          if sudo systemctl is-active --quiet "${FSW_SERVICE}"; then
            echo "[INFO] ${FSW_SERVICE} is running"
          else
            echo "::error::${FSW_SERVICE} is not running"
            sudo systemctl status "${FSW_SERVICE}" --no-pager -l || true
            sudo journalctl -u "${FSW_SERVICE}" --no-pager -n 40 || true
            exit 1
          fi
        fi

        # Resolve the dictionary.
        DICT_RESOLVED=$(ls -1 ${DICTIONARY} 2>/dev/null | head -n1 || true)
        if [ -z "${DICT_RESOLVED}" ]; then
          echo "::error::No dictionary matched '${DICTIONARY}'"
          exit 1
        fi
        echo "[INFO] Dictionary: ${DICT_RESOLVED}"

        if [ -n "${VENV}" ]; then
          echo "[INFO] Activating virtualenv ${VENV}"
          # shellcheck disable=SC1091
          . "${VENV}/bin/activate"
        fi

        cd "${WORKING_DIR}"

        TIMEOUT_CMD="timeout"
        if ! command -v ${TIMEOUT_CMD} > /dev/null 2>&1; then
          TIMEOUT_CMD="gtimeout"
        fi

        echo "[INFO] Running soak integration tests"
        ${TIMEOUT_CMD} --kill-after=10s "${TIMEOUT_SECONDS}s" \
          pytest --dictionary "${DICT_RESOLVED}" \
            "${TEST_PATH}" ${PYTEST_ARGS}
