name: "F´ Soak Test"
description: "Analyze accumulated soak telemetry for FATALs/degradation, then run integration tests against the persistent GDS"
runs:
  using: "composite"
  steps:
    - name: "Run soak test"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        # Used by gh CLI inside test.sh to disable the cron workflow on FATAL
        GH_TOKEN: ${{ github.token }}
      run: ${{ github.action_path }}/scripts/test.sh
