name: "F´ Soak Deploy"
description: "Install a built F´ deployment on a target platform in preparation for soak testing."
inputs:
  platform:
    description: "Platform (e.g. 'linux'). Selects scripts/deploy_<platform>.sh."
    required: true
  gds-args:
    description: "Extra arguments appended to fprime-gds (e.g. '--framing-selection fprime-framing')."
    required: false
    default: ""
  fsw-args:
    description: "Arguments passed to the FSW binary (e.g. '-a 127.0.0.1 -p 50000')."
    required: false
    default: "-a 127.0.0.1 -p 50000"
  fsw-host:
    description: "Remote SSH host for FSW deployment (e.g. 'pi@192.168.1.100'). Required for linux-remote platform."
    required: false
    default: ""
  fsw-ip:
    description: "IP address where FSW listens (used by GDS to connect). Required for linux-remote platform."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: "Soak Setup"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GDS_ARGS: ${{ inputs.gds-args }}
      run: ${{ github.action_path }}/scripts/setup.sh
    - name: "Soak deploy (${{ inputs.platform }})"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        FSW_ARGS: ${{ inputs.fsw-args }}
        GDS_ARGS: ${{ inputs.gds-args }}
        FSW_HOST: ${{ inputs.fsw-host }}
        FSW_IP: ${{ inputs.fsw-ip }}
      run: ${{ github.action_path }}/scripts/deploy_${{ inputs.platform }}.sh
