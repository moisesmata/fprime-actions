name: "F´ Soak Deploy"
description: "Install a built F´ deployment, start the flight software, and leave persistent GDS + flight-ops rotation services running for soak testing."

inputs:
  deployment-name:
    description: "Unique name; namespaces install dir, systemd services, and ZMQ sockets."
    required: true
  platform:
    description: "'linux' (FSW local on the runner) | 'linux-remote' (FSW on a Pi over SSH, user 'fprime', port 50000) | 'pico2' (FSW flashed by fprime-ci, serial /dev/pico2)."
    required: true
  fsw-ip:
    description: "Remote FSW Pi IP (linux-remote only)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Soak setup (${{ inputs.platform }})"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DEPLOYMENT_NAME: ${{ inputs.deployment-name }}
        PLATFORM: ${{ inputs.platform }}
        FSW_IP: ${{ inputs.fsw-ip }}
      run: ${{ github.action_path }}/scripts/setup.sh
