name: "F´ Soak Deploy"
description: "Install a built F´ deployment on a target platform and start a persistent GDS service for soak testing."

inputs:
  deployment-name:
    description: "Unique name; namespaces install dir, systemd service, and ZMQ sockets."
    required: true
  platform:
    description: "'linux' | 'linux-remote' | 'pico2'."
    required: true
  fsw-ip:
    description: "Remote FSW Pi IP (linux-remote only). SSH user is 'fprime'."
    required: false
    default: ""
  fsw-args:
    description: "Launch args for the remote FSW (linux-remote only). Deployment-specific: a TCP FSW wants e.g. '-a <addr> -p <port>', a radio-only FSW takes none. Defaults to empty."
    required: false
    default: ""
  fsw-device:
    description: "FSW serial device (pico2 only)."
    required: false
    default: "/dev/pico2"
  gds-args:
    description: "Extra flags appended to fprime-gds. Communication selection is driven by the deployment's fprime-gds.yml; only the namespaced --zmq-transport flag is added automatically."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Soak setup (stage artifacts + start GDS)"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DEPLOYMENT_NAME: ${{ inputs.deployment-name }}
        PLATFORM: ${{ inputs.platform }}
        FSW_IP: ${{ inputs.fsw-ip }}
        FSW_DEVICE: ${{ inputs.fsw-device }}
        GDS_ARGS: ${{ inputs.gds-args }}
      run: ${{ github.action_path }}/scripts/setup.sh

    - name: "Soak deploy (${{ inputs.platform }})"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DEPLOYMENT_NAME: ${{ inputs.deployment-name }}
        PLATFORM: ${{ inputs.platform }}
        FSW_IP: ${{ inputs.fsw-ip }}
        FSW_ARGS: ${{ inputs.fsw-args }}
        FSW_DEVICE: ${{ inputs.fsw-device }}
      run: ${{ github.action_path }}/scripts/deploy.sh
