name: "F´ Soak Deploy"
description: "Install a built F´ deployment as persistent flight-software and GDS systemd services for soak testing"
inputs:
  gds-args:
    description: "Extra arguments appended to fprime-gds (e.g. '--framing-selection fprime-framing')."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: "Deploy soak services"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GDS_ARGS: ${{ inputs.gds-args }}
      run: ${{ github.action_path }}/scripts/deploy.sh
