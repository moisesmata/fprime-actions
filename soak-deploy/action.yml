name: "F´ Soak Deploy"
description: "Install a built F´ deployment as persistent flight-software and GDS soak services"
inputs:
  platform:
    description: "Service-manager platform: 'linux'. Future will support microcontrollers "
    required: true 
    default: "linux"
  gds-args:
    description: "Extra arguments appended to fprime-gds (e.g. '--framing-selection fprime-framing')."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: "Soak setup"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: ${{ github.action_path }}/scripts/setup.sh
    - name: "Soak deploy (${{ inputs.platform }})"
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GDS_ARGS: ${{ inputs.gds-args }}
      run: ${{ github.action_path }}/scripts/deploy_${{ inputs.platform }}.sh
