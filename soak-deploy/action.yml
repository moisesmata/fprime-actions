name: "F´ Soak Deploy"
description: "Install a built F´ deployment as persistent flight-software and GDS systemd services for soak testing"
inputs:
  install-dir:
    description: "Directory to install the soak deployment into"
    required: false
    default: "/opt/fprime-soak"
  binary:
    description: "Path (glob allowed) to the built flight-software binary to install, relative to the workspace"
    required: true
  install-binary-name:
    description: "Name to install the flight-software binary as (keeps the service ExecStart stable across deployment renames)"
    required: false
    default: "fsw"
  dictionary:
    description: "Path (glob allowed) to the deployment topology dictionary JSON, relative to the workspace"
    required: true
  requirements:
    description: "Path to a requirements.txt used to build the soak virtualenv (must install fprime-gds)"
    required: true
  extra-pip-packages:
    description: "Extra pip packages to install into the soak virtualenv (space-separated, e.g. psutil)"
    required: false
    default: ""
  test-source:
    description: "Optional directory of integration tests to install (copied into <install-dir>/test)"
    required: false
    default: ""
  service-prefix:
    description: "Prefix for the systemd service names (<prefix>-fsw, <prefix>-gds)"
    required: false
    default: "fprime-soak"
  service-user:
    description: "Linux user to run the services as (defaults to the current user)"
    required: false
    default: ""
  fsw-bind-address:
    description: "Address the flight-software binary binds for the GDS TCP connection"
    required: false
    default: "0.0.0.0"
  fsw-port:
    description: "TCP port the flight-software binary listens on"
    required: false
    default: "50000"
  fsw-extra-args:
    description: "Extra arguments appended to the flight-software ExecStart"
    required: false
    default: ""
  gds-connect-address:
    description: "Address the persistent GDS connects to (the flight software's address)"
    required: false
    default: "127.0.0.1"
  gds-extra-args:
    description: "Extra arguments appended to fprime-gds (e.g. --framing-selection space-packet-space-data-link)"
    required: false
    default: ""
  com-logger-subdir:
    description: "Subdirectory under <install-dir> where the FSW ComLogger writes .com files (created and cleared on deploy). Leave empty to skip."
    required: false
    default: "ComLoggerFiles"
outputs:
  install-dir:
    description: "Absolute install directory"
    value: ${{ steps.deploy.outputs.install-dir }}
  venv:
    description: "Path to the soak virtualenv"
    value: ${{ steps.deploy.outputs.venv }}
  dictionary:
    description: "Absolute path to the installed dictionary JSON"
    value: ${{ steps.deploy.outputs.dictionary }}
  com-logs:
    description: "Absolute path to the ComLogger directory (empty if disabled)"
    value: ${{ steps.deploy.outputs.com-logs }}
  fsw-service:
    description: "Name of the installed flight-software systemd service"
    value: ${{ steps.deploy.outputs.fsw-service }}
  gds-service:
    description: "Name of the installed persistent GDS systemd service"
    value: ${{ steps.deploy.outputs.gds-service }}
runs:
  using: "composite"
  steps:
    - name: "Deploy soak services"
      id: deploy
      shell: bash
      env:
        TEMPLATES_DIR: ${{ github.action_path }}/templates
        INSTALL_DIR: ${{ inputs.install-dir }}
        BINARY_GLOB: ${{ inputs.binary }}
        BINARY_NAME: ${{ inputs.install-binary-name }}
        DICTIONARY_GLOB: ${{ inputs.dictionary }}
        REQUIREMENTS: ${{ inputs.requirements }}
        EXTRA_PIP: ${{ inputs.extra-pip-packages }}
        TEST_SOURCE: ${{ inputs.test-source }}
        SERVICE_PREFIX: ${{ inputs.service-prefix }}
        SERVICE_USER_INPUT: ${{ inputs.service-user }}
        FSW_BIND_ADDRESS: ${{ inputs.fsw-bind-address }}
        FSW_PORT: ${{ inputs.fsw-port }}
        FSW_EXTRA_ARGS: ${{ inputs.fsw-extra-args }}
        GDS_CONNECT_ADDRESS: ${{ inputs.gds-connect-address }}
        GDS_EXTRA_ARGS: ${{ inputs.gds-extra-args }}
        COM_LOGGER_SUBDIR: ${{ inputs.com-logger-subdir }}
      run: |
        set -e

        SERVICE_USER="${SERVICE_USER_INPUT:-$(whoami)}"
        FSW_SERVICE="${SERVICE_PREFIX}-fsw"
        GDS_SERVICE="${SERVICE_PREFIX}-gds"

        # --- Resolve build artifacts (globs allowed) ----------------------------
        BINARY_RESOLVED=$(ls -1 ${BINARY_GLOB} 2>/dev/null | head -n1 || true)
        if [ -z "${BINARY_RESOLVED}" ]; then
          echo "::error::No flight-software binary matched '${BINARY_GLOB}'"
          exit 1
        fi
        DICT_RESOLVED=$(ls -1 ${DICTIONARY_GLOB} 2>/dev/null | head -n1 || true)
        if [ -z "${DICT_RESOLVED}" ]; then
          echo "::error::No dictionary matched '${DICTIONARY_GLOB}'"
          exit 1
        fi
        DICT_SRC_DIR=$(dirname "${DICT_RESOLVED}")
        DICT_BASENAME=$(basename "${DICT_RESOLVED}")
        echo "[INFO] Binary:     ${BINARY_RESOLVED}"
        echo "[INFO] Dictionary: ${DICT_RESOLVED}"

        # --- Stop any previous soak services so we get a clean slot -------------
        for svc in "${FSW_SERVICE}" "${GDS_SERVICE}"; do
          sudo systemctl stop "${svc}" 2>/dev/null || true
          sudo systemctl disable "${svc}" 2>/dev/null || true
        done

        # --- Install tree --------------------------------------------------------
        echo "[INFO] Installing into ${INSTALL_DIR}"
        sudo mkdir -p "${INSTALL_DIR}/bin" "${INSTALL_DIR}/dict" "${INSTALL_DIR}/gds-logs"
        sudo cp "${BINARY_RESOLVED}" "${INSTALL_DIR}/bin/${BINARY_NAME}"
        sudo chmod +x "${INSTALL_DIR}/bin/${BINARY_NAME}"
        sudo cp -r "${DICT_SRC_DIR}/." "${INSTALL_DIR}/dict/"

        if [ -n "${TEST_SOURCE}" ] && [ -d "${TEST_SOURCE}" ]; then
          echo "[INFO] Installing integration tests from ${TEST_SOURCE}"
          sudo rm -rf "${INSTALL_DIR}/test"
          sudo mkdir -p "${INSTALL_DIR}/test"
          sudo cp -r "${TEST_SOURCE}/." "${INSTALL_DIR}/test/"
        fi

        COM_LOGS_PATH=""
        if [ -n "${COM_LOGGER_SUBDIR}" ]; then
          COM_LOGS_PATH="${INSTALL_DIR}/${COM_LOGGER_SUBDIR}"
          echo "[INFO] Preparing ComLogger directory ${COM_LOGS_PATH}"
          sudo rm -rf "${COM_LOGS_PATH}"
          sudo mkdir -p "${COM_LOGS_PATH}"
        fi

        # --- Virtualenv ----------------------------------------------------------
        echo "[INFO] Building virtualenv at ${INSTALL_DIR}/venv"
        sudo rm -rf "${INSTALL_DIR}/venv"
        sudo python3 -m venv "${INSTALL_DIR}/venv"
        sudo "${INSTALL_DIR}/venv/bin/pip" install -U pip wheel setuptools
        sudo "${INSTALL_DIR}/venv/bin/pip" install -r "${REQUIREMENTS}"
        if [ -n "${EXTRA_PIP}" ]; then
          sudo "${INSTALL_DIR}/venv/bin/pip" install ${EXTRA_PIP}
        fi

        # The service user must own the tree so it can write logs and .com files
        # ("user:" sets the group to the user's login group).
        sudo chown -R "${SERVICE_USER}:" "${INSTALL_DIR}"

        # --- Render + install systemd unit files --------------------------------
        render() {
          sed \
            -e "s#__INSTALL_DIR__#${INSTALL_DIR}#g" \
            -e "s#__SERVICE_USER__#${SERVICE_USER}#g" \
            -e "s#__SERVICE_PREFIX__#${SERVICE_PREFIX}#g" \
            -e "s#__BINARY_NAME__#${BINARY_NAME}#g" \
            -e "s#__FSW_BIND_ADDRESS__#${FSW_BIND_ADDRESS}#g" \
            -e "s#__FSW_PORT__#${FSW_PORT}#g" \
            -e "s#__FSW_EXTRA_ARGS__#${FSW_EXTRA_ARGS}#g" \
            -e "s#__FSW_SERVICE_NAME__#${FSW_SERVICE}#g" \
            -e "s#__GDS_CONNECT_ADDRESS__#${GDS_CONNECT_ADDRESS}#g" \
            -e "s#__GDS_EXTRA_ARGS__#${GDS_EXTRA_ARGS}#g" \
            "$1"
        }

        echo "[INFO] Installing ${FSW_SERVICE}.service"
        render "${TEMPLATES_DIR}/fsw.service" | sudo tee "/etc/systemd/system/${FSW_SERVICE}.service" > /dev/null
        echo "[INFO] Installing ${GDS_SERVICE}.service"
        render "${TEMPLATES_DIR}/gds.service" | sudo tee "/etc/systemd/system/${GDS_SERVICE}.service" > /dev/null

        echo "::group::${FSW_SERVICE}.service"
        cat "/etc/systemd/system/${FSW_SERVICE}.service"
        echo "::endgroup::"
        echo "::group::${GDS_SERVICE}.service"
        cat "/etc/systemd/system/${GDS_SERVICE}.service"
        echo "::endgroup::"

        # --- Start services ------------------------------------------------------
        sudo systemctl daemon-reload
        sudo systemctl enable "${FSW_SERVICE}" "${GDS_SERVICE}"
        sudo systemctl restart "${FSW_SERVICE}"
        sleep 3
        sudo systemctl restart "${GDS_SERVICE}"
        sleep 5

        for svc in "${FSW_SERVICE}" "${GDS_SERVICE}"; do
          if sudo systemctl is-active --quiet "${svc}"; then
            echo "[INFO] ${svc} is active"
          else
            echo "::error::${svc} failed to start"
            sudo systemctl status "${svc}" --no-pager -l || true
            sudo journalctl -u "${svc}" --no-pager -n 40 || true
            exit 1
          fi
        done

        # --- Outputs -------------------------------------------------------------
        {
          echo "install-dir=${INSTALL_DIR}"
          echo "venv=${INSTALL_DIR}/venv"
          echo "dictionary=${INSTALL_DIR}/dict/${DICT_BASENAME}"
          echo "com-logs=${COM_LOGS_PATH}"
          echo "fsw-service=${FSW_SERVICE}"
          echo "gds-service=${GDS_SERVICE}"
        } >> "${GITHUB_OUTPUT}"

        echo "[INFO] Soak deploy complete: ${FSW_SERVICE} + persistent ${GDS_SERVICE}"
